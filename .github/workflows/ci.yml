name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w apps/api
      # The homepage is prerendered from the API at build time, so it must be running.
      - name: Start API
        run: |
          node apps/api/dist/index.js &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/api/health && exit 0; sleep 1; done
          echo "API did not start" && exit 1
      - run: npm run build -w apps/web
